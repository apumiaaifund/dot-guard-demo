<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DotGuard — FMCSA & DOT Fleet Compliance Calculator</title><style>body{font-family:system-ui,sans-serif;background:#090d16;color:#f1f5f9;max-width:760px;margin:0 auto;padding:28px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px;margin-top:16px}label{display:block;margin-top:10px;color:#94a3b8;font-size:13px}input{width:100%;padding:9px;margin-top:4px;border-radius:8px;border:1px solid #334155;background:#030712;color:#fff}button{margin-top:14px;padding:11px 18px;border:none;border-radius:8px;background:#10b981;color:#052e16;font-weight:800;cursor:pointer}#res{margin-top:14px;padding:12px;background:#030712;border-radius:8px;font-family:monospace;color:#38bdf8}</style></head><body><h1>DotGuard — US FMCSA &amp; DOT Quota Calculator</h1><p>Zero-Float 49 CFR Part 382 (50% Drug / 10% Alcohol) &amp; Medical Card Audit Sandbox</p><div class="card"><label>Active CDL Drivers</label><input id="d" type="number" value="15"><label>Completed Drug Tests (YTD)</label><input id="dt" type="number" value="6"><label>Completed Alcohol Tests (YTD)</label><input id="at" type="number" value="1"><label>Expired Medical Cards</label><input id="mc" type="number" value="1"><button onclick="calc()">Audit Fleet Compliance</button><div id="res"></div></div><script>function calc(){const d=+document.getElementById("d").value,dt=+document.getElementById("dt").value,at=+document.getElementById("at").value,mc=+document.getElementById("mc").value;const rd=Math.ceil(d*0.5),ra=Math.ceil(d*0.1),dd=Math.max(0,rd-dt),ad=Math.max(0,ra-at),fine=(dd+ad+Math.max(0,mc))*2500;document.getElementById("res").textContent=`Required Drug: ${rd} | Required Alcohol: ${ra} | Deficits: ${dd+ad} | Expired Med Cards: ${mc} | Est. FMCSA Fine Risk: $${fine.toLocaleString()}.00`;}</script></body></html>
